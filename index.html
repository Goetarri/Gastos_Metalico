<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metálico</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .btn-icon { transition: transform 0.1s; }
    .btn-icon:active { transform: scale(0.9); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // COMPONENTE 1: HEADER & MENÚ
    // ==========================================
    const Header = ({ gastosTotales, ingresosTotales, onExport, onImport, onBorrarTodo }) => {
      const [menuAbierto, setMenuAbierto] = useState(false);

      return (
        <header className="bg-blue-900 text-white py-2 px-3 shadow-md sticky top-0 z-10">
          <div className="flex justify-between items-center">
            <h1 className="text-xl font-bold">Metálico</h1>
            
            <div className="flex gap-3 text-right">
              <div className="flex flex-col">
                <span className="text-[10px] uppercase tracking-wide opacity-80 leading-none">Gastos</span>
                <span className="text-sm font-bold text-red-200 leading-tight">
                  {gastosTotales.toFixed(2)} €
                </span>
              </div>
              <div className="flex flex-col">
                <span className="text-[10px] uppercase tracking-wide opacity-80 leading-none">Ingresos</span>
                <span className="text-sm font-bold text-white leading-tight">
                  {ingresosTotales.toFixed(2)} €
                </span>
              </div>
            </div>

            <div className="relative">
              <button 
                aria-label="Abrir menú"
                className="text-xl px-2 py-1 focus:outline-none" 
                onClick={() => setMenuAbierto(!menuAbierto)}
              >
                ☰
              </button>
              
              {menuAbierto && (
                <div className="absolute right-0 mt-1 w-48 bg-white text-gray-800 rounded shadow-lg overflow-hidden z-20">
                  <button onClick={() => { onExport(); setMenuAbierto(false); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 text-xs">
                    📥 Exportar CSV
                  </button>
                  <label className="w-full text-left px-3 py-2 hover:bg-gray-100 text-xs cursor-pointer block">
                    📤 Importar CSV
                    <input type="file" accept=".csv" className="hidden" onChange={(e) => { onImport(e); setMenuAbierto(false); }} />
                  </label>
                  <div className="border-t my-0.5"></div>
                  <button onClick={() => { onBorrarTodo(); setMenuAbierto(false); }} className="w-full text-left px-3 py-2 hover:bg-red-50 text-xs text-red-600 font-medium">
                    🗑️ Borrar todo
                  </button>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    };

    // ==========================================
    // COMPONENTE 2: FORMULARIO
    // ==========================================
    const FormularioTransaccion = ({ onGuardar, registroEditando, onCancelarEdicion }) => {
      const [concepto, setConcepto] = useState('');
      const [cantidad, setCantidad] = useState('');
      const [fecha, setFecha] = useState('');
      const inputRef = useRef(null);

      const obtenerFechaLocalISO = (fechaObj = new Date()) => {
        const anio = fechaObj.getFullYear();
        const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
        const dia = String(fechaObj.getDate()).padStart(2, '0');
        return `${anio}-${mes}-${dia}`;
      };

      useEffect(() => {
        if (registroEditando) {
          setConcepto(registroEditando.concepto);
          setCantidad(Math.abs(registroEditando.cantidad).toString());
          setFecha(obtenerFechaLocalISO(new Date(registroEditando.fecha)));
        } else {
          setConcepto('');
          setCantidad('');
          setFecha(obtenerFechaLocalISO());
        }
        
        const enfocarInput = () => {
          if (inputRef.current) {
            inputRef.current.focus();
            inputRef.current.click();
          }
        };

        enfocarInput();
        const timer1 = setTimeout(enfocarInput, 100);
        const timer2 = setTimeout(enfocarInput, 300);

        return () => {
          clearTimeout(timer1);
          clearTimeout(timer2);
        };
      }, [registroEditando]);

      const procesarGuardado = (tipo) => {
        if (!concepto.trim() || !cantidad || isNaN(cantidad) || !fecha) return;

        const valorNumerico = parseFloat(cantidad);
        const cantidadFinal = tipo === 'gasto' ? -Math.abs(valorNumerico) : Math.abs(valorNumerico);
        const fechaFinal = new Date(fecha + 'T00:00:00').toISOString();

        onGuardar({
          id: registroEditando ? registroEditando.id : Date.now(),
          fecha: fechaFinal,
          concepto: concepto.trim(),
          cantidad: cantidadFinal
        });

        setConcepto('');
        setCantidad('');
        setFecha(obtenerFechaLocalISO());
        
        setTimeout(() => {
          if (inputRef.current) {
            inputRef.current.focus();
            inputRef.current.click();
          }
        }, 50);
      };

      const manejarEnvioTeclado = (e) => {
        e.preventDefault();
        const tipoPorDefecto = registroEditando && registroEditando.cantidad > 0 ? 'ingreso' : 'gasto';
        procesarGuardado(tipoPorDefecto);
      };

      return (
        <form onSubmit={manejarEnvioTeclado} className={`p-2 shadow-sm mb-1.5 rounded-b-md ${registroEditando ? 'bg-yellow-50' : 'bg-white'}`}>
          <div className="flex flex-col gap-1.5">
            {/* Fila 1: Fecha, Concepto e Importe */}
            <div className="flex gap-1.5">
              <input 
                type="date" 
                value={fecha} 
                onChange={(e) => setFecha(e.target.value)}
                className="w-28 sm:w-32 px-1.5 py-1.5 text-xs border rounded focus:ring-1 focus:ring-blue-900 outline-none"
                required
              />
              <input 
                ref={inputRef}
                type="text" 
                placeholder="Concepto" 
                value={concepto} 
                onChange={(e) => setConcepto(e.target.value)}
                className="flex-grow px-2 py-1.5 text-sm border rounded focus:ring-1 focus:ring-blue-900 outline-none min-w-0"
                required
              />
              <input 
                type="number" 
                placeholder="0.00" 
                step="0.01" 
                min="0.01"
                value={cantidad} 
                onChange={(e) => setCantidad(e.target.value)}
                className="w-20 sm:w-24 px-2 py-1.5 text-sm border rounded focus:ring-1 focus:ring-blue-900 outline-none"
                required
              />
            </div>

            {/* Fila 2: Botones de Acción */}
            <div className="flex gap-1.5">
              <button 
                type="button" 
                onClick={() => procesarGuardado('gasto')}
                className="flex-1 px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs rounded font-bold shadow transition-colors text-center"
              >
                - Gasto
              </button>
              
              <button 
                type="button" 
                onClick={() => procesarGuardado('ingreso')}
                className="flex-1 px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs rounded font-bold shadow transition-colors text-center"
              >
                + Ingreso
              </button>
              
              {registroEditando && (
                <button 
                  type="button" 
                  aria-label="Cancelar edición" 
                  onClick={onCancelarEdicion} 
                  className="px-3 py-1.5 bg-gray-300 text-gray-700 text-xs rounded hover:bg-gray-400 font-bold transition-colors"
                >
                  ✕
                </button>
              )}
            </div>
          </div>
        </form>
      );
    };

    // ==========================================
    // COMPONENTE 3: TABLA DE REGISTROS
    // ==========================================
    const TablaRegistros = ({ registros, idEdicion, onEditar, onBorrar }) => {
      const [orden, setOrden] = useState({ columna: 'fecha', ascendente: false });

      const registrosOrdenados = useMemo(() => {
        return [...registros].sort((a, b) => {
          let valorA = a[orden.columna];
          let valorB = b[orden.columna];
          
          if (orden.columna === 'concepto') {
            valorA = valorA.toLowerCase();
            valorB = valorB.toLowerCase();
          }

          if (valorA < valorB) return orden.ascendente ? -1 : 1;
          if (valorA > valorB) return orden.ascendente ? 1 : -1;
          return 0;
        });
      }, [registros, orden]);

      const cambiarOrden = (columna) => {
        setOrden(prev => ({
          columna,
          ascendente: prev.columna === columna ? !prev.ascendente : (columna !== 'fecha')
        }));
      };

      if (registros.length === 0) {
        return <p className="text-center text-gray-500 my-4 text-xs">No hay registros guardados.</p>;
      }

      return (
        <div className="bg-white rounded-md shadow overflow-x-auto">
          <table className="w-full text-xs text-left">
            <thead className="bg-gray-50 text-gray-700 uppercase text-[10px]">
              <tr>
                <th className="px-2 py-1.5 cursor-pointer hover:bg-gray-100" onClick={() => cambiarOrden('fecha')}>
                  Fecha {orden.columna === 'fecha' && (orden.ascendente ? '↑' : '↓')}
                </th>
                <th className="px-2 py-1.5 cursor-pointer hover:bg-gray-100" onClick={() => cambiarOrden('concepto')}>
                  Concepto {orden.columna === 'concepto' && (orden.ascendente ? '↑' : '↓')}
                </th>
                <th className="px-2 py-1.5 text-right cursor-pointer hover:bg-gray-100" onClick={() => cambiarOrden('cantidad')}>
                  Importe {orden.columna === 'cantidad' && (orden.ascendente ? '↑' : '↓')}
                </th>
                <th className="px-2 py-1.5 text-center">Acc.</th>
              </tr>
            </thead>
            <tbody>
              {registrosOrdenados.map((reg) => (
                <tr key={reg.id} className={`border-b hover:bg-gray-50 transition-colors ${idEdicion === reg.id ? 'bg-yellow-100' : ''}`}>
                  <td 
                    onClick={() => onEditar(reg)}
                    className="px-2 py-1 whitespace-nowrap text-gray-500 text-[11px] cursor-pointer hover:text-blue-900 transition-colors"
                    title="Haz clic para editar"
                  >
                    {new Date(reg.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' })}
                  </td>
                  <td 
                    onClick={() => onEditar(reg)}
                    className="px-2 py-1 font-medium text-gray-900 truncate max-w-[120px] sm:max-w-none cursor-pointer hover:text-blue-900 transition-colors"
                    title="Haz clic para editar"
                  >
                    {reg.concepto}
                  </td>
                  <td className={`px-2 py-1 text-right font-bold ${reg.cantidad < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                    {reg.cantidad > 0 ? '+' : ''}{reg.cantidad.toFixed(2)} €
                  </td>
                  <td className="px-2 py-1 text-center">
                    <button aria-label="Borrar" onClick={() => onBorrar(reg.id)} className="btn-icon text-red-500 hover:text-red-700 text-xs">🗑️</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    };

    // ==========================================
    // COMPONENTE PADRE: APP
    // ==========================================
    const App = () => {
      const [registros, setRegistros] = useState(() => {
        const guardado = localStorage.getItem('metalico_registros');
        return guardado ? JSON.parse(guardado) : [];
      });
      const [registroEditando, setRegistroEditando] = useState(null);

      useEffect(() => {
        localStorage.setItem('metalico_registros', JSON.stringify(registros));
      }, [registros]);

      const guardarRegistro = (nuevoRegistro) => {
        if (registroEditando) {
          setRegistros(registros.map(r => r.id === nuevoRegistro.id ? nuevoRegistro : r));
          setRegistroEditando(null);
        } else {
          setRegistros([...registros, nuevoRegistro]);
        }
      };

      const borrarRegistro = (id) => {
        if (confirm('¿Seguro que quieres borrar este registro?')) {
          setRegistros(registros.filter(r => r.id !== id));
          if (registroEditando?.id === id) setRegistroEditando(null);
        }
      };

      const borrarTodo = () => {
        if (confirm('¿Estás seguro de que quieres borrar TODOS los registros? Esta acción no se puede deshacer.')) {
          setRegistros([]);
          setRegistroEditando(null);
        }
      };

      const exportarCSV = () => {
        const cabecera = "ID,Fecha,Concepto,Cantidad\n";
        const filas = registros.map(r => `${r.id},${r.fecha},"${r.concepto}",${r.cantidad}`).join("\n");
        const blob = new Blob([cabecera + filas], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `metalico_export_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };

      const importarCSV = (e) => {
        const archivo = e.target.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = (evento) => {
          const texto = evento.target.result;
          const lineas = texto.split('\n').slice(1);
          const nuevosRegistros = lineas.filter(l => l.trim()).map(linea => {
            const [id, fecha, conceptoRaw, cantidad] = linea.split(',');
            return {
              id: parseInt(id) || Date.now() + Math.random(),
              fecha: fecha || new Date().toISOString(),
              concepto: conceptoRaw.replace(/"/g, ''),
              cantidad: parseFloat(cantidad) || 0
            };
          });
          if (confirm(`¿Importar ${nuevosRegistros.length} registros? Esto se sumará a los actuales.`)) {
            setRegistros([...registros, ...nuevosRegistros]);
          }
        };
        lector.readAsText(archivo);
        e.target.value = null;
      };

      const { gastosTotales, ingresosTotales } = useMemo(() => {
        return registros.reduce(
          (acumulador, registro) => {
            if (registro.cantidad < 0) {
              acumulador.gastosTotales += Math.abs(registro.cantidad);
            } else {
              acumulador.ingresosTotales += registro.cantidad;
            }
            return acumulador;
          },
          { gastosTotales: 0, ingresosTotales: 0 }
        );
      }, [registros]);

      return (
        <div className="min-h-screen pb-2">
          <Header 
            gastosTotales={gastosTotales}
            ingresosTotales={ingresosTotales}
            onExport={exportarCSV}
            onImport={importarCSV}
            onBorrarTodo={borrarTodo}
          />
          
          <main className="px-1 mt-1">
            <FormularioTransaccion 
              onGuardar={guardarRegistro}
              registroEditando={registroEditando}
              onCancelarEdicion={() => setRegistroEditando(null)}
            />
            
            <TablaRegistros 
              registros={registros}
              idEdicion={registroEditando?.id}
              onEditar={setRegistroEditando}
              onBorrar={borrarRegistro}
            />
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
